<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f3">
  <title>محصولات فروشگاه</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">فروشگاه آنلاین</p>
        <h1>محصولات فروشگاه</h1>
      </div>
      <button id="close-app" class="icon-button" type="button" aria-label="بستن برنامه">×</button>
    </header>

    <section class="store-intro" aria-labelledby="listing-title">
      <div>
        <p class="connection-status"><span class="status-dot"></span><span id="status-text">در حال اتصال...</span></p>
        <h2 id="listing-title">انتخابی برای هر سلیقه</h2>
      </div>
    </section>

    <div class="listing-heading">
      <h2>محصولات فروشگاه</h2>
    </div>
    <div id="products-list" class="products-list" aria-live="polite" aria-busy="true">
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-image"></div><div class="skeleton-lines"><span></span><span></span><span></span></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-image"></div><div class="skeleton-lines"><span></span><span></span><span></span></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-image"></div><div class="skeleton-lines"><span></span><span></span><span></span></div></div>
    </div>

    <section id="products-state" class="products-state" hidden aria-live="polite">
      <div class="state-icon" aria-hidden="true">□</div>
      <h2 id="state-title"></h2>
      <p id="state-message"></p>
      <button id="retry-products" class="retry-button" type="button" hidden>تلاش دوباره</button>
    </section>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
